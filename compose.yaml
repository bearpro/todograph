services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      FRONTEND_DIST: /app/frontend
      MONGODB_URI: mongodb://mongo:27017/todo-graph
      MONGODB_DB: todo-graph
    ports:
      - "8080:8080"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
