<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>ToDo Graph</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/vendor/bootstrap-5.3.8.min.css">
    <link rel="stylesheet" href="/app.css">
  </head>

  <body>
    <div id="app"></div>

    <script src="/main.js"></script>
    <script src="/ports/project-storage.js"></script>
    <script src="/ports/project-sync.js"></script>
    <script>
      const app = Elm.Main.init({
        node: document.getElementById("app")
      });

      window.TodoGraphProjectStorage.init(app);
      window.TodoGraphProjectSync.init(app);

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
